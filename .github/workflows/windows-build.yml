name: Windows build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install NSIS 3.12
        shell: pwsh
        run: choco install nsis --version=3.12 --yes --no-progress

      - name: Build application and installer
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) { throw "NSIS executable not found: $makensis" }
          .\packaging\build_release.ps1 -Python python -MakeNSIS $makensis

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-gallery-windows-${{ github.sha }}
          path: 发布包/1.0.1/*
          if-no-files-found: error
          retention-days: 14
